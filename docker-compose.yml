services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: myhrs-app
    restart: always
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:alpine
    container_name: myhrs-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - app
